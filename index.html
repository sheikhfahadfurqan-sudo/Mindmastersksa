    // --- EXECUTIVE USER ROLES & ACCESS CONTROL MANAGEMENT PANEL ---
    const UserManagementModule = () => {

      const handleRoleSelect = (email, newRole) => {
        setSelectedRoles(prev => ({ ...prev, [email]: newRole }));

      const saveRoleUpdate = async (userEmail) => {
        const newRole = selectedRoles[userEmail];
        if (!newRole) return;

        setUsers(prev => prev.map(u => u.email.toLowerCase() === userEmail.toLowerCase() ? { ...u, role: newRole } : u));

        if (supabase) {
          try {
            await supabase.from('profiles').update({ role: newRole }).eq('email', userEmail);
          } catch (err) {
            console.warn('Supabase profile role update error:', err);
          }
        }

        setStatusMsg(`Clearance role for ${userEmail} successfully updated to ${newRole} in database.`);
        setTimeout(() => setStatusMsg(''), 4000);
      };

      const revokeAccess = async (userEmail) => {
        if (userEmail.toLowerCase() === currentUser?.email?.toLowerCase()) {
          alert('You cannot revoke your own Executive clearance account.');
          return;
        }

        if (confirm(`Are you sure you want to revoke access and delete user ${userEmail}?`)) {
          setUsers(prev => prev.filter(u => u.email.toLowerCase() !== userEmail.toLowerCase()));

          if (supabase) {
            try {
              await supabase.from('profiles').delete().eq('email', userEmail);
            } catch (err) {
              console.warn('Supabase delete profile error:', err);
            }

          setStatusMsg(`Revoked corporate access and deleted account ${userEmail}.`);

                  </tr>

                  {users.map(u => (
                    <tr key={u.id} className="hover:bg-slate-800/40 transition">

    // --- CONFIDENTIAL DOCUMENT VAULT MODULE ---
    const VaultModule = () => {
      const { t, currentUser, users } = useAuthRole();
      const [search, setSearch] = useState('');
      const [category, setCategory] = useState('ALL');
      const [docs, setDocs] = useState([]);
      const [showUpload, setShowUpload] = useState(false);
      const [fileName, setFileName] = useState('');
      const [targetAssignee, setTargetAssignee] = useState('ALL');
      const [fileAttachment, setFileAttachment] = useState(null);

      const isExec = currentUser?.role === 'EXECUTIVE';

      const handleFilePick = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setFileName(file.name);
        const reader = new FileReader();
        reader.onloadend = () => {
          setFileAttachment(reader.result);
        };
        reader.readAsDataURL(file);
      };

      const handleUpload = (e) => {
        e.preventDefault();
        if (!fileName) return;
        const newDoc = {
          id: `v_${Date.now()}`,
          name: fileName,
          category: 'Contracts',
          size: '2.5 MB',
          clearance: currentUser?.role || 'EMPLOYEE',
          uploadedBy: currentUser?.name || 'Fahad Furqan',
          targetAssignee: isExec ? targetAssignee : 'ALL',
          date: new Date().toISOString().split('T')[0],
          attachment: fileAttachment
        };
        setDocs([newDoc, ...docs]);
        setFileName('');
        setFileAttachment(null);
        setTargetAssignee('ALL');
        setShowUpload(false);
      };

      // Employees see docs uploaded by themselves, or docs assigned to 'ALL' or specifically to them
      const visibleDocs = docs.filter(d => {
        if (isExec) return true; // MD sees all
        const isTarget = d.targetAssignee === 'ALL' || d.targetAssignee === currentUser?.email || d.uploadedBy === currentUser?.name;
        return isTarget;
      });

      const filteredDocs = visibleDocs.filter(d => {
        const matchesCat = category === 'ALL' || d.category === category;
        const matchesSearch = d.name.toLowerCase().includes(search.toLowerCase());
        return matchesCat && matchesSearch;
      });

      return (
        <div className="space-y-6">
          <div className="flex items-center justify-between">
            <div>
              <h2 className="text-xl font-bold text-slate-100 font-outfit">{t('vaultTitle')}</h2>
              <p className="text-xs text-slate-400">
                {isExec ? t('vaultExecSub') : t('vaultEmpSub')}
              </p>
            </div>
            <button
              type="button"
              onClick={() => setShowUpload(true)}
              className="px-4 py-2 bg-gradient-to-r from-indigo-600 to-emerald-500 hover:brightness-110 text-white font-bold text-xs rounded-xl shadow-lg flex items-center gap-1.5"
            >
              {t('uploadDocBtn')}
            </button>
          </div>

          <div className="flex flex-wrap items-center justify-between gap-3 bg-slate-900 p-4 rounded-2xl border border-slate-800 text-xs">
            <input
              type="text"
              placeholder={t('searchVaultPlaceholder')}
              value={search}
              onChange={e => setSearch(e.target.value)}
              className="bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2 text-slate-100 outline-none w-full sm:w-72"
            />
            <div className="flex gap-1.5 flex-wrap">
              {['ALL', 'Contracts', 'Compliance', 'Technical', 'Board'].map(cat => (
                <button
                  key={cat}
                  type="button"
                  onClick={() => setCategory(cat)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition ${category === cat ? 'bg-indigo-600 text-white font-bold shadow' : 'bg-slate-950 text-slate-400 border border-slate-800'}`}
                >
                  {cat === 'ALL' ? t('catAll') : cat === 'Contracts' ? t('catContracts') : cat === 'Compliance' ? t('catCompliance') : cat === 'Technical' ? t('catTechnical') : t('catBoard')}
                </button>
              ))}
            </div>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {filteredDocs.length === 0 ? (
              <div className="p-8 text-center bg-slate-900 rounded-2xl border border-slate-800 text-slate-500 text-xs col-span-2 space-y-2">
                <p>{t('noVaultDocs')}</p>
                <p className="text-[11px] text-slate-600">{t('clickUploadDoc')}</p>
              </div>
            ) : (
              filteredDocs.map(doc => (
                <div key={doc.id} className="p-4 bg-slate-900 rounded-2xl border border-slate-800 flex items-center justify-between gap-3 text-xs">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-xl bg-indigo-950 border border-indigo-800 flex items-center justify-center font-bold text-indigo-300 text-xs shrink-0">
                      FILE
                    </div>
                    <div className="space-y-1">
                      <span className="font-bold text-slate-100 block truncate max-w-xs">{doc.name}</span>
                      <span className="text-[10px] text-slate-400 block">{t('uploadedBy')} {doc.uploadedBy} • {doc.date}</span>
                      {doc.targetAssignee !== 'ALL' && (
                        <span className="text-[9px] text-amber-400 font-bold block">{t('assignedTo')} {doc.targetAssignee}</span>
                      )}
                    </div>
                  </div>
                  <button
                    type="button"
                    onClick={() => {
                      if (doc.attachment) {
                        const win = window.open();
                        win.document.write(`<iframe src="${doc.attachment}" frameborder="0" style="border:0; top:0px; left:0px; bottom:0px; right:0px; width:100%; height:100%;" allowfullscreen></iframe>`);
                      } else {
                        alert(`Downloading document ${doc.name}...`);
                      }
                    }}
                    className="px-3 py-1.5 bg-slate-950 hover:bg-slate-800 border border-slate-800 text-indigo-300 font-bold rounded-lg shrink-0 text-[10px]"
                  >
                    {t('viewDownload')}
                  </button>
                </div>
              ))
            )}
          </div>

          {showUpload && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl max-w-md w-full space-y-4 text-xs">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-slate-100 text-sm font-outfit">{t('uploadModalTitle')}</h3>
                  <button type="button" onClick={() => setShowUpload(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <form onSubmit={handleUpload} className="space-y-3 text-left rtl:text-right">
                  <div>
                    <label className="text-slate-300 font-semibold block mb-1">{t('docTitleLabel')}</label>
                    <input
                      type="text"
                      required
                      value={fileName}
                      onChange={e => setFileName(e.target.value)}
                      placeholder="e.g. Electrical_Engineering_Specification_2026.pdf"
                      className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-slate-100 outline-none"
                    />
                  </div>

                  <div>
                    <label className="text-slate-300 font-semibold block mb-1">{t('selectLocalFile')}</label>
                    <input
                      type="file"
                      onChange={handleFilePick}
                      className="w-full bg-slate-950 border border-slate-800 p-2 rounded-xl text-slate-300 text-xs"
                    />
                  </div>

                  {isExec && (
                    <div>
                      <label className="text-slate-300 font-semibold block mb-1">{t('assignAccess')}</label>
                      <select
                        value={targetAssignee}
                        onChange={e => setTargetAssignee(e.target.value)}
                        className="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-xl text-slate-100 outline-none font-semibold"
                      >

          setLoading(false);

                    />
                  </div>
                  <div>
                    <label className="text-slate-300 text-xs font-semibold block mb-1">{t('department')}</label>
                    <input
                      type="text"
                      required
                      value={department}
                      onChange={e => setDepartment(e.target.value)}
                      placeholder="Engineering"
                      className="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 p-2.5 rounded-xl text-slate-100 text-xs outline-none"
                    />
                  </div>
                </div>

                <div className="p-2.5 bg-slate-950 rounded-xl border border-slate-800 text-[10px] text-slate-400">
                  <span>🛡️ Security Policy: New corporate registrations are assigned default <strong>EMPLOYEE</strong> clearance until promoted by Executive Admin.</span>
                </div>

                <div>
                  <label className="text-slate-300 text-xs font-semibold block mb-1">{t('corporatePassword')}</label>
                  <input
                    type="password"
                    required
                    value={password}
                    onChange={e => setPassword(e.target.value)}
                    placeholder="••••••••"
                    className="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 p-2.5 rounded-xl text-slate-100 text-xs outline-none font-mono"
                  />
                </div>

                <button
                  type="submit"
                  disabled={loading}
                  className="w-full py-3 bg-gradient-to-r from-indigo-600 via-violet-600 to-emerald-500 hover:brightness-110 text-white font-bold text-xs rounded-xl shadow-lg transition active:scale-98 disabled:opacity-50"
                >
                  {loading ? 'Creating Account...' : t('register')}
                </button>
              </form>
            )}
          </div>
        </div>
      );
    };

    // --- MAIN APP ---
    const MainApp = () => {
      const { isLoggedIn, currentUser, t, tasks, toggleTaskStatus, expenses } = useAuthRole();
      const [activeTab, setActiveTab] = useState('dashboard');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [showExpModal, setShowExpModal] = useState(false);
      const [showLeaveModal, setShowLeaveModal] = useState(false);
      const role = currentUser?.role;

      if (!isLoggedIn) {
        return <AuthScreen />;
      }

      const isTabAllowed = () => {
        if (activeTab === 'user_management' && role !== 'EXECUTIVE') return false;
        if (activeTab === 'crm' && (role === 'EMPLOYEE' || role === 'PROJECT_MANAGER')) return false;
        return true;
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans relative">
          <Header mobileMenuOpen={mobileMenuOpen} setMobileMenuOpen={setMobileMenuOpen} />
          <div className="flex-1 flex flex-col lg:flex-row overflow-hidden relative">
            <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} mobileMenuOpen={mobileMenuOpen} setMobileMenuOpen={setMobileMenuOpen} />
            <main className="flex-1 p-3.5 sm:p-6 pb-6 overflow-y-auto max-w-7xl mx-auto w-full">
              {!isTabAllowed() ? (
                <div className="p-8 rounded-2xl bg-slate-900 border border-slate-800 text-center space-y-3">
                  <h3 className="font-bold text-slate-100 text-base font-outfit">{t('dashboard')}</h3>
                  <button type="button" onClick={() => setActiveTab('dashboard')} className="px-4 py-2 bg-indigo-600 text-white font-bold text-xs rounded-xl">
                    {t('returnOverview')}
                  </button>
                </div>
              ) : (
                <>
                  {activeTab === 'dashboard' && (
                    <div className="space-y-6">
                      <div className="p-6 rounded-2xl bg-gradient-to-r from-indigo-950 via-slate-900 to-slate-950 border border-indigo-500/20 shadow-xl flex items-center justify-between">
                        <div>
                          <h2 className="text-xl font-bold text-white font-outfit">{t('welcomeBack')}, {currentUser?.name}</h2>
                          <p className="text-xs text-slate-400 mt-1">{t('operationsWorkspace')} • {currentUser?.role?.replace('_', ' ')} {t('portalLabel')}</p>
                        </div>
                        <span className="px-3.5 py-1 rounded-xl bg-slate-950 border border-slate-800 text-xs font-bold text-indigo-400 shadow">
                          {currentUser?.role}
                        </span>
                      </div>

                      {/* ACTION SHORTCUTS BAR FOR ALL ROLES */}
                      <div className="p-4 rounded-2xl bg-slate-900 border border-slate-800 flex flex-wrap items-center justify-between gap-3">
                        <div className="text-xs">
                          <span className="font-bold text-slate-100 block">{t('quickActions')}</span>
                          <span className="text-slate-400">{t('quickActionsSub')}</span>
                        </div>
                        <div className="flex gap-2">
                          <button
                            type="button"
                            onClick={() => setShowExpModal(true)}
                            className="px-3.5 py-2 bg-gradient-to-r from-indigo-600 to-violet-600 hover:brightness-110 text-white font-bold text-xs rounded-xl shadow"
                          >
                            {t('submitExpenseBtn')}
                          </button>
                          <button
                            type="button"
                            onClick={() => setShowLeaveModal(true)}
                            className="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-indigo-300 border border-indigo-500/40 font-bold text-xs rounded-xl shadow"
                          >
                            {t('requestLeaveBtn')}
                          </button>
                        </div>
                      </div>

                      {/* REAL METRICS */}
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div className="p-5 rounded-2xl bg-slate-900 border border-slate-800 space-y-1">
                          <span className="text-xs text-slate-400 block font-medium">{t('reimbursementClaims')}</span>
                          <div className="text-xl font-extrabold text-indigo-300 font-outfit">
                            SAR {expenses.reduce((a, b) => a + b.amountSAR, 0).toLocaleString()}.00
                          </div>
                          <span className="text-[10px] text-slate-500 block">{expenses.length} {t('recordsInDb')}</span>
                        </div>

                        <div className="p-5 rounded-2xl bg-slate-900 border border-slate-800 space-y-1">
                          <span className="text-xs text-slate-400 block font-medium">{t('activeActionables')}</span>
                          <div className="text-xl font-extrabold text-amber-300 font-outfit">
                            {tasks.length} {t('activeTasks')}
                          </div>
                          <span className="text-[10px] text-slate-500 block">{t('tasksQueue')}</span>
                        </div>

                        <div className="p-5 rounded-2xl bg-slate-900 border border-slate-800 space-y-1">
                          <span className="text-xs text-slate-400 block font-medium">{t('monthlyDisbursedPayroll')}</span>
                          <div className="text-xl font-extrabold text-emerald-400 font-outfit">
                            SAR {currentUser?.basicSalary > 0 ? (currentUser.basicSalary * 1.2525).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '0.00'}
                          </div>
                          <span className="text-[10px] text-slate-500 block">{t('samaWps')}</span>
                        </div>
                      </div>

                      {/* MY ASSIGNED ACTIONABLES BOARD */}
                      <div className="p-6 rounded-2xl bg-slate-900 border border-slate-800 space-y-4">
                        <div className="flex items-center justify-between">
                          <h3 className="font-bold text-slate-200 text-sm font-outfit">{t('myTasks')}</h3>
                          <span className="text-[10px] text-slate-400">{t('toggleProgressNotice')}</span>
                        </div>

                        {tasks.length === 0 ? (
                          <div className="p-8 text-center bg-slate-950 rounded-xl border border-slate-800 text-slate-500 text-xs">
                            {t('noTasksInDb')}
                          </div>
                        ) : (
                          <div className="space-y-3 text-xs">
                            {tasks.map(task => (
                              <div key={task.id} className="p-4 bg-slate-950 rounded-xl border border-slate-800 flex items-center justify-between gap-3">
                                <div className="space-y-1">
                                  <div className="flex items-center gap-2">
                                    <span className="font-bold text-slate-100">{task.title}</span>
                                    <span className={`px-2 py-0.5 rounded text-[9px] font-extrabold ${
                                      task.priority === 'URGENT' ? 'bg-rose-950 text-rose-300 border border-rose-800' : 'bg-indigo-950 text-indigo-300'
                                    }`}>
                                      {task.priority}
                                    </span>
                                  </div>
                                  <span className="text-slate-400 text-[11px] block">{task.project} • Due: {task.dueDate}</span>
                                </div>

                                <button
                                  type="button"
                                  onClick={() => toggleTaskStatus(task.id)}
                                  className={`px-3 py-1.5 rounded-lg font-extrabold text-[10px] transition active:scale-95 ${
                                    task.status === 'COMPLETE' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' :
                                    task.status === 'REVIEW' ? 'bg-violet-950 text-violet-300 border border-violet-800' :
                                    'bg-amber-950 text-amber-300 border border-amber-800'
                                  }`}
                                >
                                  {task.status === 'COMPLETE' ? '✓ Complete' : task.status === 'REVIEW' ? '🔍 Under Review' : '⏳ In Progress'}
                                </button>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>

                      <SubmitExpenseModal isOpen={showExpModal} onClose={() => setShowExpModal(false)} />
                      <SubmitLeaveModal isOpen={showLeaveModal} onClose={() => setShowLeaveModal(false)} />
                    </div>
                  )}

                  {activeTab === 'user_management' && <UserManagementModule />}
                  {activeTab === 'expenses' && <ExpensesModule />}
                  {activeTab === 'hr' && <HRModule />}
                  {activeTab === 'vault' && <VaultModule />}
                  {activeTab === 'crm' && <CRMModule />}
                  {activeTab === 'projects' && <ProjectsModule />}
                </>
              )}
            </main>
          </div>
        </div>
      );
    };

    const App = () => (
      <AuthRoleProvider>
        <MainApp />
      </AuthRoleProvider>
    );

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
