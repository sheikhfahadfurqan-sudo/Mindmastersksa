<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mind Masters</title>
<meta name="description" content="Mind Masters KSA — expenses, approvals and projects">
<meta name="theme-color" content="#0e0e0e">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Mind Masters">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f5f3;--card:#fff;--ink:#121212;--ink2:#3a3a3a;--muted:#6f6f6f;--line:#e6e4df;--soft:#efeee9;
--ok:#1f7a4d;--okbg:#e6f4ec;--warn:#946600;--warnbg:#fdf3dc;--info:#2456a6;--infobg:#e7eefb;--bad:#b3261e;--badbg:#fbe9e7;
--r:14px;--shadow:0 1px 2px rgba(0,0,0,.03),0 4px 16px rgba(0,0,0,.035);
--font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
html[lang=ar]{--font:'IBM Plex Sans Arabic','Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:inherit}
h2,h3,h4{margin:0}
.ic{width:20px;height:20px;flex:none}
.screen{min-height:100vh;min-height:100dvh}
.center{display:flex;align-items:center;justify-content:center;padding:24px}
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:spin .8s linear infinite}
.spinner.sm{width:20px;height:20px;border-width:2px}
@keyframes spin{to{transform:rotate(360deg)}}
.muted{color:var(--muted)} .small{font-size:13px} .mt{margin-top:16px} .w100{width:100%}
.num{font-variant-numeric:tabular-nums}

/* login */
#login,#disabled{background:#0b0b0b;color:#eee}
.login-card{width:100%;max-width:380px;text-align:center}
.login-logo{width:92px;height:92px;border-radius:26px;margin-bottom:18px;box-shadow:0 0 0 1px #222}
.login-full{display:block;width:250px;max-width:75%;height:auto;margin:0 auto}
.login-sub{margin-top:18px!important;letter-spacing:.04em}
.login-card h1{font-size:26px;margin:0;letter-spacing:.02em}
.login-card p{margin:6px 0 0}
.login-card .muted{color:#9a9a9a}
#btn-signin{margin-top:30px;background:#fff;color:#111}
#btn-signin:hover{background:#ececec}
.login-foot{display:flex;justify-content:center;gap:8px;margin-top:22px;flex-wrap:wrap}
#login .btn-ghost,#disabled .btn-ghost{color:#ddd;border-color:#333}
#login .btn-ghost:hover,#disabled .btn-ghost:hover{background:#1a1a1a}
.login-err{margin-top:18px;text-align:start;background:#2a1311;color:#ffb4ab;border:1px solid #5c2420;border-radius:12px;padding:12px 14px;font-size:13.5px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 16px;border-radius:12px;font-weight:600;font-size:14px;border:1px solid transparent;white-space:nowrap;transition:background .15s,opacity .15s}
.btn:disabled{opacity:.55;cursor:default}
.btn-lg{height:52px;font-size:15px;border-radius:14px}
.btn-sm{height:34px;padding:0 12px;font-size:13px;border-radius:10px}
.btn-sm .ic{width:16px;height:16px}
.btn-primary{background:var(--ink);color:#fff} .btn-primary:hover{background:#2b2b2b}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)} .btn-ghost:hover{background:var(--soft)}
.btn-ok{background:var(--ok);color:#fff} .btn-ok:hover{background:#196640}
.btn-bad{background:var(--bad);color:#fff}
.btn-bad-ghost{background:transparent;color:var(--bad);border-color:#efc9c5} .btn-bad-ghost:hover{background:var(--badbg)}
.danger{color:var(--bad)!important}
.link{color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px;font-size:14px}
.icon-btn{width:38px;height:38px;display:inline-grid;place-items:center;border-radius:10px;color:var(--ink2)} .icon-btn:hover{background:var(--soft)}

/* shell */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:#0e0e0e;color:#cfcfcf;display:flex;flex-direction:column;padding:20px 12px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 10px 22px}
.brand img{width:40px;height:40px;border-radius:12px}
.brand b{display:block;color:#fff;font-size:15px} .brand small{color:#8a8a8a;font-size:12px}
#side-nav{display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:#bdbdbd;font-weight:500;font-size:14px;text-align:start;position:relative}
.nav-item:hover{background:#1a1a1a;color:#fff}
.nav-item.on{background:#fff;color:#111}
.badge{font-style:normal;margin-inline-start:auto;background:var(--bad);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;padding:0 6px;border-radius:10px;display:inline-grid;place-items:center}
.side-foot{margin-top:auto;border-top:1px solid #222;padding:14px 6px 0;display:flex;align-items:center;gap:10px}
.side-foot .who{min-width:0;flex:1}
.side-foot b{display:block;color:#fff;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot small{color:#888;font-size:11px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-foot .icon-btn{color:#aaa} .side-foot .icon-btn:hover{background:#1a1a1a;color:#fff}
.main-col{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 28px;padding-top:calc(14px + env(safe-area-inset-top));background:rgba(245,245,243,.9);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.tb-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;min-width:0}
.tb-brand img{width:32px;height:32px;border-radius:9px;display:none}
.tb-brand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-actions{display:flex;align-items:center;gap:6px}
.lang-btn{height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);font-weight:600;font-size:13px;background:var(--card)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;font-weight:700;font-size:13px;display:inline-grid;place-items:center;flex:none}
.side-foot .avatar{background:#fff;color:#111}
main#view{padding:24px 28px 120px;max-width:1120px;width:100%}
.preview{background:#fff7e0;border-bottom:1px solid #f0dfaa;color:#6b5200;padding:10px 28px;font-size:13px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.preview button{font-weight:700;text-decoration:underline}
.tabbar,.fab{display:none}
@media (max-width:900px){
 .shell{grid-template-columns:1fr}
 .side{display:none}
 .topbar{padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
 .tb-brand img{display:block}
 .tb-brand{font-size:17px}
 .hide-sm{display:none!important}
 main#view{padding:16px 14px calc(120px + env(safe-area-inset-bottom))}
 .preview{padding:10px 14px}
 .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .tabbar .nav-item{flex:1;flex-direction:column;gap:3px;padding:6px 2px;font-size:11px;color:var(--muted);align-items:center;text-align:center;min-width:0}
 .tabbar .nav-item span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .tabbar .nav-item:hover{background:none;color:var(--ink)}
 .tabbar .nav-item.on{background:none;color:var(--ink);font-weight:700}
 .tabbar .nav-item.on .ic{stroke-width:2.3}
 .tabbar .badge{position:absolute;top:1px;inset-inline-start:calc(50% + 5px);margin:0;min-width:18px;height:18px;font-size:10px;padding:0 5px}
 .fab{display:grid;place-items:center;position:fixed;inset-inline-end:16px;bottom:calc(80px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;background:var(--ink);color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:25}
 .fab .ic{width:26px;height:26px}
}

/* content */
.hello h2{font-size:24px;letter-spacing:-.01em}
.hello p{margin:2px 0 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.stat small{color:var(--muted);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:6px}
.stat small::before{content:'';width:8px;height:8px;border-radius:50%;background:#cfcbc2;flex:none}
.stat.ok small::before{background:var(--ok)} .stat.warn small::before{background:#e0a300} .stat.bad small::before{background:var(--bad)}
.stat b{display:block;font-size:22px;margin-top:6px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stat span{font-size:12px;color:var(--muted)}
@media(max-width:560px){.stats{grid-template-columns:1fr 1fr;gap:10px}.stat{padding:13px}.stat b{font-size:17px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:14px;min-width:0}
.card h3{font-size:15px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 0 10px;flex-wrap:wrap}
.sec-head:first-child{margin-top:0}
.sec-head h3{font-size:16px;display:flex;align-items:center;gap:8px}
.count{background:var(--soft);border-radius:20px;padding:1px 9px;font-size:12px;font-weight:600;color:var(--ink2)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;transition:border-color .15s}
.row:hover{border-color:#cfcbc2}
.row-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--soft);color:var(--ink2)}
.row-ic.proj{background:#eef1f8;color:#33456e}
.row-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.row-end{text-align:end;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.row-amt{font-weight:700;font-size:14.5px;white-space:nowrap}
.row-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
@media(max-width:560px){.row-actions .btn{flex:1}.row-ic{display:none}.row{grid-template-columns:minmax(0,1fr) auto}}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--soft);color:var(--ink2)}
.st-PENDING_MANAGER{background:var(--infobg);color:var(--info)}
.st-PENDING_ACCOUNTS{background:#efe9fb;color:#5b3aa6}
.st-PENDING_EXECUTIVE{background:var(--warnbg);color:var(--warn)}
.st-APPROVED,.ps-ACTIVE{background:var(--okbg);color:var(--ok)}
.st-REJECTED{background:var(--badbg);color:var(--bad)}
.ps-ON_HOLD{background:var(--warnbg);color:var(--warn)}
.chip-dark{background:var(--ink);color:#fff}
.empty{text-align:center;padding:36px 16px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:var(--r);font-size:14px}
.callout{display:flex;align-items:center;gap:12px;background:var(--ink);color:#fff;border-radius:var(--r);padding:14px 16px;margin:16px 0;cursor:pointer;width:100%;text-align:start}
.callout span{flex:1;font-weight:500}
.callout b{background:#fff;color:#111;padding:6px 12px;border-radius:9px;font-size:13px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select,.search{height:40px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 10px;font-size:14px;min-width:0;outline:none}
.filters select:focus,.search:focus{border-color:var(--ink)}
.search{min-width:180px;flex:1}
@media(max-width:560px){.filters select{flex:1 1 45%}.search{flex:1 1 100%}}
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:12px;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{height:34px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;white-space:nowrap}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.sumline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:2px 2px 10px}
.chk{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:500;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--ink);margin:0}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.seg button{height:34px;padding:0 14px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);flex:1;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg-sm button{height:30px;padding:0 10px;font-size:12.5px}
.dash-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
@media(max-width:560px){.dash-head .seg{width:100%}.dash-head .seg button{padding:0 6px}}
.plist{display:flex;flex-direction:column;gap:14px}
.pl-top{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.pl-top b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pl-sub{font-size:12px;margin:2px 0 6px}
.bar{height:6px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:4px}
.bar.over i{background:var(--bad)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);text-align:start;width:100%}
.pcard:hover{border-color:#cfcbc2}
.pc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:22px}
.code{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.03em}
.pcard h4{font-size:16px}
.pc-meta{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2)}
.pc-meta .ic{width:15px;height:15px}
.pc-spend{margin-top:6px;font-size:12.5px;color:var(--muted)}
.pc-spend .bar{margin-top:5px}
.prow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;width:100%;text-align:start}
.prow:hover{border-color:#cfcbc2}
.prow .who{flex:1;min-width:0}
.prow b{display:block}
.prow small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:45%}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}
.flow{display:grid;gap:8px;margin:4px 0 16px}
.flow>div{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;background:var(--soft);border-radius:10px;padding:10px 12px}
.flow>div>b{min-width:120px}
.flow .step{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 9px;font-weight:600;font-size:12.5px}

/* modal */
.ov{position:fixed;inset:0;z-index:100;background:rgba(10,10,10,.45);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .15s}
.ov.in{opacity:1}
.sheet{background:var(--card);border-radius:18px;width:100%;max-width:520px;max-height:calc(100dvh - 40px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}
.sheet-lg{max-width:640px} .sheet-sm{max-width:420px}
.m-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 14px 14px 18px;border-bottom:1px solid var(--line)}
html[dir=rtl] .m-head{padding:14px 18px 14px 14px}
.m-head h3{font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-body{padding:18px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;-webkit-overflow-scrolling:touch}
.m-body p{margin:0}
.m-foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex-wrap:wrap}
@media(max-width:600px){.ov{padding:0;align-items:flex-end}.sheet,.sheet-lg,.sheet-sm{max-width:none;border-radius:18px 18px 0 0;max-height:94dvh}.m-foot .btn{flex:1}}
.field{display:flex;flex-direction:column;gap:6px;margin:0;min-width:0}
.field>span{font-size:13px;font-weight:600;color:var(--ink2)}
.field i{font-style:normal;font-weight:400;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;font-size:16px;outline:none;transition:border-color .15s}
.field textarea{resize:vertical;min-height:70px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ink)}
.field input:disabled,.field select:disabled{background:var(--soft);color:var(--muted)}
.field .search{width:100%;min-height:40px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:420px){.two{grid-template-columns:1fr}}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;border:1.5px dashed #cfcbc2;border-radius:14px;padding:18px;cursor:pointer;text-align:center;background:#fafaf8}
.drop.has{border-style:solid;border-color:var(--ok);background:var(--okbg)}
.drop b{font-size:14px;word-break:break-all}
.drop .ic{width:26px;height:26px}
.prev{max-height:180px;border-radius:12px;object-fit:contain;background:var(--soft);margin-top:8px;align-self:flex-start;max-width:100%}
.route{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13.5px}
.route b{display:block;font-size:11.5px;color:var(--muted);margin-bottom:2px;font-weight:600}
.err{background:var(--badbg);color:var(--bad);border-radius:10px;padding:10px 12px;font-size:13.5px}
.alert{border-radius:12px;padding:12px 14px;font-size:14px}
.alert.bad{background:var(--badbg);color:var(--bad)}
.note{font-size:13px;color:var(--muted);background:var(--soft);border-radius:10px;padding:10px 12px}
.checklist{max-height:240px;overflow-y:auto;border:1px solid var(--line);border-radius:12px}
.ck{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.ck:last-child{border-bottom:0}
.ck input{width:18px;height:18px;accent-color:var(--ink);flex:none;margin:0}
.ck span{display:flex;flex-direction:column;min-width:0}
.ck small{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis}
.x-top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.x-amt{font-size:28px;font-weight:700;letter-spacing:-.01em}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500;word-break:break-word}
.receipt{min-height:90px;display:grid;place-items:center;background:var(--soft);border-radius:14px;overflow:hidden;padding:0}
.receipt img{display:block;max-width:100%;max-height:440px;object-fit:contain}
.receipt a{width:100%;display:flex;justify-content:center}
.receipt p{padding:16px}
.m-body h4{font-size:14px}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{position:relative;padding-inline-start:26px;padding-bottom:14px;font-size:13.5px}
.tl li::before{content:'';position:absolute;inset-inline-start:4px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--ok)}
.tl li::after{content:'';position:absolute;inset-inline-start:8px;top:19px;bottom:1px;width:2px;background:var(--line)}
.tl li:last-child{padding-bottom:0} .tl li:last-child::after{display:none}
.tl li.pending::before{background:#fff;border:2px solid #e0a300;width:6px;height:6px}
.tl li.bad::before{background:var(--bad)}
.tl li.sub::before{background:var(--ink)}
.tl small{display:block;color:var(--muted);font-size:12px}
.tl q{display:block;quotes:none;color:var(--ink2);margin-top:2px}
.tl q::before{content:'“'} .tl q::after{content:'”'}
.steps{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.menu{position:fixed;top:calc(62px + env(safe-area-inset-top));inset-inline-end:14px;z-index:60;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.15);width:270px;padding:6px;display:flex;flex-direction:column}
.menu-head{padding:10px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu-head b{display:block}
.menu-head small{color:var(--muted);font-size:12px;word-break:break-all}
.menu-sec{padding:8px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;display:flex;flex-direction:column;gap:6px;font-size:12px}
.menu>button{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;font-size:14px;text-align:start}
.menu>button:hover{background:var(--soft)}
#toast-root{position:fixed;z-index:200;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
@media(min-width:901px){#toast-root{bottom:24px}}
.toast{background:#111;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:440px;animation:tin .2s ease}
.toast.ok{background:var(--ok)} .toast.bad{background:var(--bad)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.spin .ic{animation:spin .8s linear infinite}
.pr-LOW{background:var(--soft);color:var(--muted)} .pr-HIGH{background:#fdeedd;color:#9a4b00} .pr-URGENT{background:var(--badbg);color:var(--bad)}
.ps-CLOSED{background:var(--soft);color:var(--muted)}
.tbl-wrap{overflow-x:auto;margin:0 -18px;padding:0 18px;-webkit-overflow-scrolling:touch}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:720px}
.tbl th{text-align:start;font-size:12px;font-weight:600;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer} .tbl tbody tr:hover td{background:#faf9f6}
.tbl .r{text-align:end;white-space:nowrap}
.tbl .pn b{display:block;font-weight:600} .tbl .pn small{color:var(--muted);font-size:12px}
.tbl .bar{width:90px;display:inline-block;vertical-align:middle;margin-inline-end:6px}
.neg{color:var(--bad);font-weight:600}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mini>div{background:var(--soft);border-radius:12px;padding:10px 12px;min-width:0}
.mini small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.mini b{display:block;font-size:15px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:560px){.mini{grid-template-columns:1fr 1fr}}
.prose{white-space:pre-wrap;word-break:break-word;font-size:14px;margin:0}
.fsec{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:6px 0 -4px;border-top:1px solid var(--line);padding-top:14px}
.fsec:first-child{border-top:0;padding-top:0;margin-top:0}
html[lang=ar] .fsec{text-transform:none;letter-spacing:0}
.pc-dates{font-size:12px;color:var(--muted)}
</style>
</head>

</div>

</div>

async function signIn() {

async function startApp(session) {
  if (S.booting) return;
  S.booting = true;
  try {
    showScreen('boot');
    const email = String(session.user.email || '').toLowerCase();
    if (!email.endsWith(DOMAIN)) { await sb.auth.signOut(); return showLogin(t('onlyCompany')); }
    let me = null;
    for (let i = 0; i < 4 && !me; i++) {
      const { data } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
      me = data;
      if (!me) await new Promise(r => setTimeout(r, 700));
    }
    if (!me) return showLogin(t('profileMissing'));
    S.me = me;
    if (!me.active) { showScreen('disabled'); return; }
    await loadAll();
    showScreen('app');
    render();
  } catch (e) {
    console.error(e);
    showLogin(errMsg(e));
  } finally { S.booting = false; }
}

// ─── DATA ─────────────────────────────────────────────────────────
async function fetchAllRows(build) {
  const size = 1000; let from = 0; const out = [];
  for (;;) {
    const { data, error } = await build().range(from, from + size - 1);
    if (error) throw error;
    out.push(...data);
    if (data.length < size) break;
    from += size;
  }
  return out;
}
async function loadAll() {
  const [profiles, projects, expenses, settings] = await Promise.all([
    fetchAllRows(() => sb.from('profiles').select('id,email,full_name,full_name_ar,phone,role,title,department,active,created_at').order('full_name')),
    fetchAllRows(() => sb.from('projects').select('*,members:project_members(user_id)').order('created_at', { ascending: false })),
    fetchAllRows(() => sb.from('expenses').select('*').order('created_at', { ascending: false })),
    fetchAllRows(() => sb.from('app_settings').select('key,value'))
  ]);
  S.profiles = profiles; S.projects = projects; S.expenses = expenses;
  S.settings = Object.fromEntries(settings.map(x => [x.key, x.value]));
  S.umap = Object.fromEntries(profiles.map(u => [u.id, u]));
  S.pmap = Object.fromEntries(projects.map(p => [p.id, p]));
  if (S.umap[S.me.id]) S.me = S.umap[S.me.id];
  S.lastLoad = Date.now();
}
async function reload(manual) {
  if (!S.me) return;
  const btn = manual && $('#btn-refresh');
  if (btn) btn.classList.add('spin');
  try {
    await loadAll();
    if (!S.me.active) { showScreen('disabled'); return; }
    if (!$('#app').classList.contains('hidden')) render();
    if (manual) toast(t('refreshed'));
  } catch (e) { toast(errMsg(e), 'bad'); }
  finally { const b = $('#btn-refresh'); if (b) b.classList.remove('spin'); }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.me && Date.now() - S.lastLoad > 30000 && !document.querySelector('#modal-root .ov')) reload();
});
setInterval(() => {

}, 30000);

function inPeriod(e, per) {
  if (per === 'all') return true;
  const d = toDate(e.expense_date), n = new Date();
  if (per === 'month') return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth();
  if (per === 'last') { const l = new Date(n.getFullYear(), n.getMonth() - 1, 1); return d.getFullYear() === l.getFullYear() && d.getMonth() === l.getMonth(); }
  if (per === 'year') return d.getFullYear() === n.getFullYear();
  return true;
}
function barList(items) {
  if (!items.length) return empty(t('noData'));
  const max = Math.max(...items.map(i => i.value), 1);
  return `<div class="plist">${items.map(i => `<div><div class="pl-top"><b>${esc(i.label)}</b><span>${money(i.value)}</span></div>

// ─── VIEW: EXPENSES ───────────────────────────────────────────────
function filteredExpenses() {
  const f = S.f;
  let a = execView() && !f.mine ? S.expenses.slice() : myExpenses();
  if (f.status === 'pending') a = a.filter(e => PENDING.includes(e.status));
  else if (f.status !== 'all') a = a.filter(e => e.status === f.status);
  if (execView() && !f.mine) {
    if (f.project === 'GENERAL') a = a.filter(e => e.expense_type === 'GENERAL');
    else if (f.project !== 'all') a = a.filter(e => e.project_id === f.project);
    if (f.employee !== 'all') a = a.filter(e => e.user_id === f.employee);
  }
  if (execView()) a = a.filter(e => inPeriod(e, f.period));
  if (f.q) {
    const q = f.q.toLowerCase();
    a = a.filter(e => [e.title, e.vendor, e.notes, uname(e.user_id), e.project_id ? pname(P(e.project_id)) : '', t('cat_' + e.category)]

function compressImage(file) {
  return new Promise(resolve => {
    if (!file.type || !/^image\/(jpeg|png|webp)$/.test(file.type)) return resolve(file);
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      try {
        const max = 1800, scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(b => { URL.revokeObjectURL(url); resolve(b && b.size < file.size ? b : file); }, 'image/jpeg', 0.82);
      } catch (e) { URL.revokeObjectURL(url); resolve(file); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}
function extFor(type, name) {
  const m = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/heic': 'heic', 'image/heif': 'heif', 'application/pdf': 'pdf' };
  if (m[type]) return m[type];
  const x = String(name || '').split('.').pop().toLowerCase();
  return /^[a-z0-9]{2,5}$/.test(x) ? x : 'bin';
}
async function submitExpense(ov, st) {
  const g = s => ov.querySelector(s);
  const errBox = g('#nf-err');
  const err = m => { errBox.textContent = m; errBox.classList.remove('hidden'); errBox.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); };
  errBox.classList.add('hidden');
  const proj = st.type === 'PROJECT' ? (g('#nf-proj') ? g('#nf-proj').value : '') : '';
  const title = g('#nf-title').value.trim();
  const amt = parseFloat(String(g('#nf-amt').value).replace(',', '.'));
  const date = g('#nf-date').value;
  if (st.type === 'PROJECT' && !proj) return err(t('projectRequired'));
  if (!title) return err(t('titleRequired'));
  if (!(amt > 0)) return err(t('amountInvalid'));
  if (!date) return err(t('dateRequired'));
  if (!st.file) return err(t('receiptRequired'));
  const btn = g('#nf-submit');
  btn.disabled = true; btn.textContent = t('uploading');
  let path = null;
  try {
    const blob = await compressImage(st.file);
    if (blob.size > MAX_FILE) throw new Error(t('fileTooBig'));
    const type = blob.type || st.file.type || 'application/octet-stream';
    path = `${S.me.id}/${uid()}.${extFor(type, st.file.name)}`;
    const up = await sb.storage.from('receipts').upload(path, blob, { contentType: type, upsert: false });
    if (up.error) throw up.error;
    btn.textContent = t('submitting');
    const { error } = await sb.from('expenses').insert({
      expense_type: st.type, project_id: proj || null, category: g('#nf-cat').value, title,
      amount_sar: Math.round(amt * 100) / 100, expense_date: date,
      vendor: g('#nf-vendor').value.trim() || null, notes: g('#nf-notes').value.trim() || null, receipt_path: path
    });
    if (error) throw error;
    if (st.prevUrl) URL.revokeObjectURL(st.prevUrl);
    closeModal(ov);
    toast(t('expenseSubmitted'), 'ok');
    if (S.view !== 'expenses' && S.view !== 'home') S.view = 'expenses';
    await reload();
  } catch (e) {
    if (path) sb.storage.from('receipts').remove([path]).catch(() => {});
    err(e && e.message === t('fileTooBig') ? e.message : errMsg(e));
    btn.disabled = false; btn.textContent = t('submit');
  }
}

async function saveProject(ov, id, oldSel) {
  const g = s => ov.querySelector(s);
  const errBox = g('#pf-err');
  const fail = m => { errBox.textContent = m; errBox.classList.remove('hidden'); errBox.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); };
  errBox.classList.add('hidden');
  const name = g('#pf-name').value.trim(), desc = g('#pf-desc').value.trim(), mgr = g('#pf-mgr').value;
  const start = g('#pf-start').value || null, end = g('#pf-end').value || null;
  if (!name) return fail(t('projNameRequired'));
  if (!desc) return fail(t('descRequired'));
  if (!mgr) return fail(t('managerRequired'));
  if (start && end && end < start) return fail(t('datesInvalid'));
  const v = sel => g(sel).value.trim() || null;
  const obj = {
    name, code: v('#pf-code'), name_ar: v('#pf-name-ar'), description: desc,
    client: v('#pf-client'), location: v('#pf-loc'), client_contact: v('#pf-cc'), client_phone: v('#pf-cp'),
    start_date: start, end_date: end, priority: g('#pf-prio').value, scope: v('#pf-scope'),
    budget_sar: Math.max(0, parseFloat(g('#pf-budget').value) || 0),
    status: g('#pf-status').value, manager_id: mgr
  };
  const btn = g('#pf-save'); btn.disabled = true; btn.textContent = t('saving');
  try {
    let pid = id;
    if (id) { const { error } = await sb.from('projects').update(obj).eq('id', id); if (error) throw error; }
    else { const { data, error } = await sb.from('projects').insert(obj).select('id').single(); if (error) throw error; pid = data.id; }
    const now = new Set([...ov.querySelectorAll('#pf-members input:checked')].map(i => i.value));
    const add = [...now].filter(x => !oldSel.has(x)).map(u => ({ project_id: pid, user_id: u }));
    const del = [...oldSel].filter(x => !now.has(x));
    if (add.length) { const { error } = await sb.from('project_members').insert(add); if (error) throw error; }
    if (del.length) { const { error } = await sb.from('project_members').delete().eq('project_id', pid).in('user_id', del); if (error) throw error; }
    closeModal(ov);
    toast(t('projectSaved'), 'ok');
    await reload();
    if (pid) mProjectDetail(pid);
  } catch (e) {
    const m = String((e && e.message) || '');
    fail(/column|schema cache/i.test(m) ? t('needsUpdateSql') : errMsg(e));
    btn.disabled = false; btn.textContent = t('save');
  }
}

// ─── CSV EXPORT ───────────────────────────────────────────────────
function exportCsv(list, label) {
  const H = ['Expense date', 'Employee', 'Email', 'Type', 'Project code', 'Project', 'Project manager', 'Category', 'Description', 'Vendor', 'Amount (SAR)', 'Status', 'Submitted at', 'First approval by', 'Final approval by', 'Rejected by', 'Rejection reason'];
  const nm = id => (id && U(id) ? U(id).full_name : '');
  const rows = list.map(e => {
    const u = U(e.user_id) || {}, p = e.project_id ? P(e.project_id) : null;
    return [e.expense_date, u.full_name || '', u.email || '', e.expense_type, p ? p.code || '' : '', p ? p.name : '', p ? nm(p.manager_id) : '', e.category, e.title, e.vendor || '',
      (+e.amount_sar).toFixed(2), e.status, e.created_at, nm(e.first_approver_id), nm(e.final_approver_id), nm(e.rejected_by), e.rejection_reason || ''];
  });
  const cell = c => {
    c = String(c == null ? '' : c);
    if (/^[=+\-@\t\r]/.test(c)) c = "'" + c;
    return /[",\n\r]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c;
  };
  const csv = '﻿' + [H, ...rows].map(r => r.map(cell).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `mind-masters-${label}-${todayISO()}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// ─── INSTALL TO PHONE (PWA) ───────────────────────────────────────
let deferredPrompt = null;
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const canInstall = () => !isStandalone();
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });
window.addEventListener('appinstalled', () => { deferredPrompt = null; toast(t('installed'), 'ok'); });
async function installApp() {
  if (deferredPrompt) { deferredPrompt.prompt(); try { await deferredPrompt.userChoice; } catch (e) {} deferredPrompt = null; return; }
  const ios = isIOS();
  openModal(`${mhead(t('installTitle'))}
    <div class="m-body">
      <ol class="steps">${(ios ? ['iosStep1', 'iosStep2', 'iosStep3'] : ['andStep1', 'andStep2', 'andStep3']).map(k => `<li>${esc(t(k))}</li>`).join('')}</ol>
      <p class="muted small">${esc(t('installNote'))}</p>
    </div>
    <div class="m-foot"><button class="btn btn-primary" onclick="closeModal()">${esc(t('close'))}</button></div>`, 'sheet-sm');
}

// ─── START ────────────────────────────────────────────────────────
async function init() {
  applyLang();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('/sw.js').catch(() => {});
  if (!window.supabase || !window.supabase.createClient) return showLogin(t('offline'));
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { flowType: 'pkce', persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
  });
  const qs = new URLSearchParams(location.search), hs = new URLSearchParams(location.hash.replace(/^#/, ''));
  const authErr = qs.get('error_description') || hs.get('error_description') || qs.get('error') || hs.get('error');
  let session = null;
  try { ({ data: { session } } = await sb.auth.getSession()); } catch (e) { console.warn(e); }
  if (location.search || location.hash) history.replaceState(null, '', location.pathname);
  sb.auth.onAuthStateChange((event, s) => {
    if (event === 'SIGNED_OUT') { if (S.me) showLogin(); }
    else if (s && !S.me && !S.booting && (event === 'SIGNED_IN' || event === 'INITIAL_SESSION')) startApp(s);
  });
  if (session && !S.me && !S.booting) await startApp(session);
  else if (session) return;
  else showLogin(authErr ? friendlyAuthError(authErr.replace(/\+/g, ' ')) : null);
}
init();
</script>
