          {isHR && (
            <div className="space-y-6">
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div className="p-5 rounded-2xl bg-slate-900/80 border border-slate-800 space-y-2">
                  <span className="text-xs text-slate-400 block font-medium">Active Headcount</span>
                  <div className="text-xl font-extrabold text-white font-outfit">4 Personnel</div>
                  <span className="text-[11px] text-slate-500 block">Registered Employees</span>
                </div>
                <div className="p-5 rounded-2xl bg-slate-900/80 border border-amber-500/30 space-y-2">
                  <span className="text-xs text-slate-400 block font-medium">Pending Leave Queue</span>
                  <div className="text-xl font-extrabold text-amber-400 font-outfit">1 Request</div>
                  <span className="text-[11px] text-slate-500 block">Approval Queue</span>
                </div>
                <div className="p-5 rounded-2xl bg-slate-900/80 border border-slate-800 space-y-2">
                  <span className="text-xs text-slate-400 block font-medium">Out of Office Today</span>
                  <div className="text-xl font-extrabold text-indigo-400 font-outfit">0 Scheduled</div>
                  <span className="text-[11px] text-slate-500 block">Absence Calendar</span>
                </div>
                <div className="p-5 rounded-2xl bg-slate-900/80 border border-slate-800 space-y-2">
                  <span className="text-xs text-slate-400 block font-medium">WPS Readiness Rate</span>
                  <div className="text-xl font-extrabold text-emerald-400 font-outfit">100%</div>
                  <span className="text-[11px] text-slate-500 block">Personnel Configured</span>
                </div>
              </div>
            </div>
          )}

          {/* EMPLOYEE DASHBOARD */}
          {isEmployee && (
            <div className="space-y-6">
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div className="p-5 rounded-2xl bg-slate-900/80 border border-indigo-500/30 space-y-2">
                  <span className="text-xs text-slate-400 block font-medium">My Pending Tasks</span>
                  <div className="text-xl font-extrabold text-indigo-300 font-outfit">2 Tasks</div>
                  <span className="text-[11px] text-slate-500 block">Assigned Items</span>
                </div>
                <div className="p-5 rounded-2xl bg-slate-900/80 border border-slate-800 space-y-2">
                  <span className="text-xs text-slate-400 block font-medium">Annual Leave Balance</span>
                  <div className="text-xl font-extrabold text-white font-outfit">21 Days</div>
                  <span className="text-[11px] text-slate-500 block">Vacation Days</span>
                </div>
                <div className="p-5 rounded-2xl bg-slate-900/80 border border-emerald-500/30 space-y-2">
                  <span className="text-xs text-slate-400 block font-medium">August Net Salary</span>
                  <div className="text-xl font-extrabold text-emerald-400 font-outfit">SAR 26,020</div>
                  <span className="text-[11px] text-slate-500 block">Disbursed SAMA WPS</span>
                </div>
                <div className="p-5 rounded-2xl bg-slate-900/80 border border-slate-800 space-y-2">
                  <span className="text-xs text-slate-400 block font-medium">Completed Deliverables</span>
                  <div className="text-xl font-extrabold text-white font-outfit">5 Done</div>
                  <span className="text-[11px] text-slate-500 block">Milestones</span>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // --- CRM MODULE ---
    const CRMModule = () => {
      const { canViewFinancials } = useAuthRole();
      return (
        <div className="space-y-6">
          <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800 flex items-center justify-between">
            <div>
              <h2 className="text-lg font-bold text-slate-100 font-outfit">CRM Client Accounts</h2>
              <p className="text-xs text-slate-400">Enterprise KSA client relationships & deal stages</p>
            </div>
          </div>

          <div className="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden">
            <table className="w-full text-left text-xs text-slate-300">
              <thead className="bg-slate-950 text-slate-400 uppercase tracking-wider text-[10px] border-b border-slate-800">
                <tr>
                  <th className="p-4">Company Name</th>
                  <th className="p-4">Key Contact</th>
                  <th className="p-4">Region</th>
                  <th className="p-4">Deal Stage</th>
                  <th className="p-4 text-right">Contract Value (SAR)</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-800">
                {MOCK_CLIENTS.map(c => (
                  <tr key={c.id} className="hover:bg-slate-800/40">
                    <td className="p-4 font-bold text-slate-100 font-outfit">{c.companyName}</td>
                    <td className="p-4">{c.contactPerson}</td>
                    <td className="p-4 text-slate-400">{c.region}</td>
                    <td className="p-4">
                      <span className="px-2 py-1 rounded text-[10px] font-bold bg-indigo-950 text-indigo-400 border border-indigo-800">
                        {c.stage}
                      </span>
                    </td>
                    <td className="p-4 text-right font-extrabold font-outfit">
                      {canViewFinancials ? `SAR ${c.contractValueSAR.toLocaleString()}` : <span className="text-amber-400 font-medium">🔒 Masked (Lead+)</span>}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    };

    // --- PROJECTS MODULE ---
    const ProjectsModule = () => {
      const { canViewFinancials } = useAuthRole();
      const [viewMode, setViewMode] = useState('kanban');

      return (
        <div className="space-y-6">
          <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800 flex items-center justify-between">
            <div>
              <h2 className="text-lg font-bold text-slate-100 font-outfit">Project & Task Workspace</h2>
              <p className="text-xs text-slate-400">Toggle between Table, Kanban, and Timeline/Gantt views</p>
            </div>
            <div className="flex items-center gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800">
              {['table', 'kanban', 'timeline'].map(mode => (
                <button
                  key={mode}
                  onClick={() => setViewMode(mode)}
                  className={`px-3 py-1.5 rounded-lg text-xs font-semibold uppercase ${viewMode === mode ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}
                >
                  {mode}
                </button>
              ))}
            </div>
          </div>

          {viewMode === 'kanban' && (
            <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
              {['TODO', 'IN_PROGRESS', 'REVIEW', 'COMPLETE'].map(status => (
                <div key={status} className="p-4 rounded-2xl bg-slate-900 border border-slate-800 space-y-3">
                  <h3 className="font-bold text-slate-300 text-xs font-outfit uppercase border-b border-slate-800 pb-2">{status.replace('_', ' ')}</h3>
                  {MOCK_TASKS.filter(t => t.status === status).map(t => (
                    <div key={t.id} className="p-3 bg-slate-950 rounded-xl border border-slate-800 space-y-2">
                      <span className="text-[10px] text-indigo-400 block font-semibold">{t.projectName}</span>
                      <h4 className="font-semibold text-slate-100 text-xs">{t.name}</h4>
                      <span className="text-[10px] text-slate-400 block">Due: {t.dueDate} • {t.assigneeName}</span>
                    </div>
                  ))}
                </div>
              ))}
            </div>
          )}

          {viewMode === 'table' && (
            <div className="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden">
              <table className="w-full text-left text-xs text-slate-300">
                <thead className="bg-slate-950 text-slate-400 uppercase text-[10px] border-b border-slate-800">
                  <tr>
                    <th className="p-4">Task Name</th>
                    <th className="p-4">Project</th>
                    <th className="p-4">Assignee</th>
                    <th className="p-4">Status</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800">
                  {MOCK_TASKS.map(t => (
                    <tr key={t.id}>
                      <td className="p-4 font-bold text-slate-100">{t.name}</td>
                      <td className="p-4 text-indigo-400">{t.projectName}</td>
                      <td className="p-4">{t.assigneeName}</td>
                      <td className="p-4"><span className="px-2 py-1 bg-slate-800 rounded text-[10px] font-bold">{t.status}</span></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {viewMode === 'timeline' && (
            <div className="bg-slate-900 p-6 rounded-2xl border border-slate-800 space-y-4">
              <h3 className="font-bold text-slate-100 text-sm font-outfit">Horizontal Gantt Chart Schedule</h3>
              <div className="space-y-3">
                {MOCK_TASKS.map(t => (
                  <div key={t.id} className="p-3 bg-slate-950 rounded-xl border border-slate-800 flex items-center justify-between text-xs">
                    <span className="font-semibold text-slate-200">{t.name}</span>
                    <div className="w-1/2 bg-slate-800 h-4 rounded-full overflow-hidden">
                      <div className="h-full bg-indigo-600 rounded-full" style={{ width: t.status === 'COMPLETE' ? '100%' : '60%' }}></div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    };

    // --- VAULT MODULE ---
    const VaultModule = () => {
      const { canDownloadRestrictedDocs } = useAuthRole();
      return (
        <div className="space-y-6">
          <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800">
            <h2 className="text-lg font-bold text-slate-100 font-outfit">Restricted Document Vault</h2>
            <p className="text-xs text-slate-400">Granular document clearance & RBAC download rules</p>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            {MOCK_DOCUMENTS.map(d => {
              const isLocked = d.clearance === 'RESTRICTED' && !canDownloadRestrictedDocs;
              return (
                <div key={d.id} className={`p-5 rounded-2xl border relative overflow-hidden space-y-3 ${isLocked ? 'bg-slate-950 border-amber-900/50' : 'bg-slate-900 border-slate-800'}`}>
                  <div className="flex items-center justify-between">
                    <span className="text-[10px] text-slate-500 uppercase font-semibold">{d.category}</span>
                    <span className={`px-2.5 py-1 rounded text-[10px] font-bold ${d.clearance === 'RESTRICTED' ? 'bg-rose-950 text-rose-400 border border-rose-800' : 'bg-emerald-950 text-emerald-400 border border-emerald-800'}`}>
                      {d.clearance}
                    </span>
                  </div>
                  <h3 className={`font-semibold text-sm ${isLocked ? 'blur-[3px] select-none text-slate-500' : 'text-slate-100'}`}>{d.title}</h3>
                  <div className="flex items-center justify-between border-t border-slate-800 pt-3 text-xs">
                    <span className="text-[10px] text-slate-500">By: {d.uploadedByName}</span>
                    {isLocked ? (
                      <span className="text-amber-400 text-xs font-bold bg-amber-950/60 px-3 py-1 rounded border border-amber-800">🔒 Download Locked</span>
                    ) : (
                      <button className="px-3 py-1 bg-indigo-600 hover:bg-indigo-500 text-white rounded text-xs font-semibold">Download</button>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    };

    // --- HR MODULE ---
    const HRModule = () => {
      const { canApproveLeave } = useAuthRole();
      return (
        <div className="space-y-6">
          <div className="bg-slate-900 p-5 rounded-2xl border border-slate-800">
            <h2 className="text-lg font-bold text-slate-100 font-outfit">HR & Absence Management</h2>
            <p className="text-xs text-slate-400">Leave approval queue & sanitized team out-of-office calendar</p>
          </div>

          {canApproveLeave && (
            <div className="p-5 rounded-2xl bg-slate-900 border border-indigo-500/30 space-y-4">
              <h3 className="font-bold text-slate-100 text-sm font-outfit">Private Executive & Manager Approval Queue</h3>
              {MOCK_LEAVE_REQUESTS.filter(l => l.status === 'PENDING').map(l => (
                <div key={l.id} className="p-4 bg-slate-950 rounded-xl border border-slate-800 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 text-xs">
                  <div>
                    <span className="font-bold text-slate-200 block">{l.employeeName} ({l.title})</span>
                    <span className="text-indigo-400 block">{l.leaveType} • {l.startDate} to {l.endDate}</span>
                    <p className="text-slate-400 italic text-[11px] mt-1">"{l.reason}"</p>
                  </div>
                  <div className="flex items-center gap-2">
                    <button className="px-3 py-1.5 bg-emerald-600 text-white rounded font-bold">Approve</button>
                    <button className="px-3 py-1.5 bg-rose-950 text-rose-300 rounded font-bold border border-rose-800">Reject</button>
                  </div>
                </div>
              ))}
            </div>
          )}

          <div className="p-5 rounded-2xl bg-slate-900 border border-slate-800 space-y-3">
            <h3 className="font-bold text-slate-100 text-sm font-outfit">Team Out-of-Office Calendar (Sanitized)</h3>
            {MOCK_LEAVE_REQUESTS.filter(l => l.status === 'APPROVED').map(l => (
              <div key={l.id} className="p-3 bg-slate-950 rounded-xl border border-slate-800 flex items-center justify-between text-xs">
                <span className="font-semibold text-slate-200">{l.employeeName} ({l.department})</span>
                <span className="px-2.5 py-1 bg-amber-950 text-amber-400 border border-amber-800 rounded font-bold">OUT OF OFFICE ({l.startDate} → {l.endDate})</span>
              </div>
            ))}
          </div>
        </div>
      );
    };

    // --- MAIN APP ASSEMBLY ---
    function WorkspaceInner() {
        const { isLoggedIn, login } = useAuthRole();
        const [email, setEmail] = React.useState('naem@mindmastersksa.com');
        const [password, setPassword] = React.useState('ExecSecret2026!');
        const [authError, setAuthError] = React.useState('');

        const handleSubmit = (e) => {
          e.preventDefault();
          setAuthError('');
          try {
            login(email, password);
          } catch (err) {
            setAuthError(err.message);
          }
        };

        const handleQuickSelect = (roleKey) => {
          setAuthError('');
          if (roleKey === 'EXECUTIVE') {
            setEmail('naem@mindmastersksa.com');
            setPassword('ExecSecret2026!');
          } else if (roleKey === 'ADMIN') {
            setEmail('admin@mindmastersksa.com');
            setPassword('AdminSecret2026!');
          } else {
            setEmail('fahad@mindmastersksa.com');
            setPassword('EmpSecret2026!');
          }
        };

        if (!isLoggedIn) {
          return (
            <div className="min-h-screen bg-slate-950 flex items-center justify-center p-4 font-sans relative overflow-hidden">
              <div className="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-3xl p-8 shadow-2xl backdrop-blur-xl relative z-10 space-y-6 text-center">
                <div className="w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-600 via-violet-600 to-emerald-400 p-0.5 mx-auto shadow-xl shadow-indigo-500/20">
                  <div className="w-full h-full bg-slate-950 rounded-[14px] flex items-center justify-center font-extrabold text-indigo-400 text-2xl font-outfit">
                    MM
                  </div>
                </div>

                <div>
                  <h2 className="text-2xl font-bold text-slate-100 font-outfit">MIND MASTERS KSA</h2>
                  <p className="text-xs text-slate-400 mt-1">Enterprise Workspace & CRM Architecture</p>
                </div>

                <div className="p-3.5 rounded-2xl bg-slate-950/80 border border-slate-800 text-left space-y-1">
                  <div className="flex items-center gap-2 text-indigo-400 text-xs font-semibold">
                    <span>🛡️ Corporate SSO Sign In</span>
                  </div>
                  <p className="text-[11px] text-slate-400">
                    Select your access level to populate corporate credentials, then click <strong>Sign In</strong>.
                  </p>
                </div>

                <div className="grid grid-cols-3 gap-2">
                  <button
                    type="button"
                    onClick={() => handleQuickSelect('EXECUTIVE')}
                    className="p-2 bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-amber-500/40 rounded-xl text-center space-y-0.5 transition"
                  >
                    <span className="text-sm">👑</span>
                    <span className="font-bold text-[10px] block text-amber-300">Executive</span>
                  </button>

                  <button
                    type="button"
                    onClick={() => handleQuickSelect('ADMIN')}
                    className="p-2 bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-indigo-500/40 rounded-xl text-center space-y-0.5 transition"
                  >
                    <span className="text-sm">🛡️</span>
                    <span className="font-bold text-[10px] block text-indigo-300">Admin</span>
                  </button>

                  <button
                    type="button"
                    onClick={() => handleQuickSelect('EMPLOYEE')}
                    className="p-2 bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-cyan-500/40 rounded-xl text-center space-y-0.5 transition"
                  >
                    <span className="text-sm">👤</span>
                    <span className="font-bold text-[10px] block text-cyan-300">Employee</span>
                  </button>
                </div>

                {authError && (
                  <div className="p-3 rounded-xl bg-rose-950/80 border border-rose-800 text-rose-300 text-xs font-semibold text-left">
                    {authError}
                  </div>
                )}

                <form onSubmit={handleSubmit} className="space-y-4 text-left">
                  <div>
                    <label className="text-slate-300 text-xs font-semibold block mb-1">Company Email</label>
                    <input
                      type="email"
                      required
                      value={email}
                      onChange={e => setEmail(e.target.value)}
                      placeholder="name@mindmastersksa.com"
                      className="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 p-3 rounded-xl text-slate-100 text-xs outline-none font-medium"
                    />
                  </div>

                  <div>
                    <label className="text-slate-300 text-xs font-semibold block mb-1">Corporate Password</label>
                    <input
                      type="password"
                      required
                      value={password}
                      onChange={e => setPassword(e.target.value)}
                      placeholder="••••••••"
                      className="w-full bg-slate-950 border border-slate-800 focus:border-indigo-500 p-3 rounded-xl text-slate-100 text-xs outline-none font-mono"
                    />
                  </div>

                  <button
                    type="submit"
                    className="w-full flex items-center justify-center gap-2 py-3 px-4 bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-bold text-xs rounded-xl shadow-lg shadow-indigo-600/30 transition active:scale-[0.98]"
                  >
                    <span>🔑 Authenticate & Sign In</span>
                  </button>
                </form>

                <p className="text-[10px] text-slate-500 pt-1">
                  Official KSA Region Workspace • Password Security System
                </p>
              </div>
            </div>
          );
        }

        return (
          <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col font-sans">
            <Header />
            <div className="flex-1 flex flex-col lg:flex-row overflow-hidden">
              <Sidebar activeTab={activeTab} setActiveTab={setActiveTab} />
              <main className="flex-1 p-6 overflow-y-auto max-w-7xl mx-auto w-full">
                {activeTab === 'dashboard' && <Dashboard setActiveTab={setActiveTab} />}
                {activeTab === 'crm' && <CRMModule />}
                {activeTab === 'projects' && <ProjectsModule />}
                {activeTab === 'vault' && <VaultModule />}
                {activeTab === 'hr' && <HRModule />}
              </main>
            </div>
          </div>
        );
      }

    const App = () => {
      return (
        <AuthRoleProvider>
          <WorkspaceInner />
        </AuthRoleProvider>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
